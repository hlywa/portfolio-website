name: Creative archive checks
on:
  pull_request:
  push:
    branches: [creative-archive-redesign, archive-page-publishing]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check archive-gallery.js
          node --check archive-data.js
          node --check writings.js
          node --check scripts/sync-notion.mjs
          node scripts/sync-notion.mjs --test
          node --check scripts/stage-site.mjs
          node scripts/stage-site.mjs "$(mktemp -d)"
  notion-connection:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/creative-archive-redesign' || github.ref == 'refs/heads/archive-page-publishing')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Notion access without exporting
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
        run: node scripts/sync-notion.mjs --check-connection
      - name: Test real approved export without publishing
        if: github.ref == 'refs/heads/archive-page-publishing'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ vars.NOTION_DATA_SOURCE_ID }}
        run: |
          node scripts/sync-notion.mjs
          node --check archive-data.js
          test -f works/in-countless-shadows.html
          grep -q "Generated from approved Creative Archive content" works/in-countless-shadows.html
          grep -q "https://luma.com/gamepoems" works/in-countless-shadows.html
          git diff --stat
